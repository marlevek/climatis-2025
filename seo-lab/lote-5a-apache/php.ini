; Configuração exclusiva das fixtures, sem serviços externos.
allow_url_fopen=Off
allow_url_include=Off
sendmail_path=/bin/false
display_errors=Off
log_errors=On
max_execution_time=5
expose_php=Off
disable_functions=mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,exec,shell_exec,system,passthru,popen,proc_open
