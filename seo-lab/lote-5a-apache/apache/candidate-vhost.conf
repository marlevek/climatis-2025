ServerName www.climatis.com.br
ServerTokens Prod
ServerSignature Off
TraceEnable Off
LogLevel warn rewrite:trace2
ErrorLog /proc/self/fd/2
LogFormat "%h %m %U%q %>s %{Location}o" lab
CustomLog /proc/self/fd/1 lab
<Directory /var/www/lab>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
</Directory>
<Directory /var/www/lab/api>
    php_flag enable_post_data_reading Off
</Directory>

<VirtualHost *:80>
    ServerName www.climatis.com.br:80
    ServerAlias climatis.com.br
    DocumentRoot /var/www/lab
# BEGIN CLIMATIS SEO5A — CANDIDATA FINAL, NÃO APLICADA
RewriteEngine On

# Acesso explícito a index; não redirecionar a resolução interna da raiz.
RewriteCond %{HTTP_HOST} ^(?:www\.)?climatis\.com\.br(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
RewriteCond %{IS_SUBREQ} =false
RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteCond %{THE_REQUEST} \s/+index\.html(?:\?|\s)
RewriteRule ^/index\.html$ https://www.climatis.com.br/ [R=302,L,NE]

# Demais caminhos; a rota antiga permanece com o Redirect do Lote 1.
RewriteCond %{HTTP_HOST} ^(?:www\.)?climatis\.com\.br(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
RewriteCond %{IS_SUBREQ} =false
RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteCond %{REQUEST_URI} !^/aparelhos-de-ar-condicionado-e-refrigeracao\.html(?:/|$)
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^www\.climatis\.com\.br$ [NC]
RewriteCond %{THE_REQUEST} ^(?:GET|HEAD)[[:space:]](/[^?[:space:]]*)(?:\?[^[:space:]]*)?[[:space:]]HTTP/
RewriteRule ^ https://www.climatis.com.br%1 [R=302,L,NE]
# END CLIMATIS SEO5A

</VirtualHost>

<VirtualHost *:443>
    ServerName www.climatis.com.br:443
    ServerAlias climatis.com.br
    DocumentRoot /var/www/lab
    SSLEngine On
    SSLCertificateFile /opt/lab/certs/lab.crt
    SSLCertificateKeyFile /opt/lab/certs/lab.key
# BEGIN CLIMATIS SEO5A — CANDIDATA FINAL, NÃO APLICADA
RewriteEngine On

# Acesso explícito a index; não redirecionar a resolução interna da raiz.
RewriteCond %{HTTP_HOST} ^(?:www\.)?climatis\.com\.br(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
RewriteCond %{IS_SUBREQ} =false
RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteCond %{THE_REQUEST} \s/+index\.html(?:\?|\s)
RewriteRule ^/index\.html$ https://www.climatis.com.br/ [R=302,L,NE]

# Demais caminhos; a rota antiga permanece com o Redirect do Lote 1.
RewriteCond %{HTTP_HOST} ^(?:www\.)?climatis\.com\.br(?::[0-9]+)?$ [NC]
RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
RewriteCond %{IS_SUBREQ} =false
RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteCond %{REQUEST_URI} !^/aparelhos-de-ar-condicionado-e-refrigeracao\.html(?:/|$)
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^www\.climatis\.com\.br$ [NC]
RewriteCond %{THE_REQUEST} ^(?:GET|HEAD)[[:space:]](/[^?[:space:]]*)(?:\?[^[:space:]]*)?[[:space:]]HTTP/
RewriteRule ^ https://www.climatis.com.br%1 [R=302,L,NE]
# END CLIMATIS SEO5A

</VirtualHost>
