ServerName www.climatis.com.br
ServerTokens Prod
TraceEnable Off
LogLevel warn rewrite:trace2
ErrorLog /proc/self/fd/2
ProxyRequests Off

<VirtualHost *:80>
    ServerName www.climatis.com.br:80
    ServerAlias climatis.com.br

    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://backend:80/
    ProxyPassReverse / http://backend:80/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.climatis.com.br:443
    ServerAlias climatis.com.br
    SSLEngine On
    SSLCertificateFile /opt/lab/certs/lab.crt
    SSLCertificateKeyFile /opt/lab/certs/lab.key

    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://backend:80/
    ProxyPassReverse / http://backend:80/
</VirtualHost>
