ServerName www.climatis.com.br
ServerTokens Prod
ServerSignature Off
TraceEnable Off
LogLevel warn rewrite:trace2
ErrorLog /proc/self/fd/2
LogFormat "%h %m %U%q %>s %{Location}o" lab
CustomLog /proc/self/fd/1 lab
<Directory /var/www/lab>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
</Directory>
<Directory /var/www/lab/api>
    php_flag enable_post_data_reading Off
</Directory>

<VirtualHost *:80>
    ServerName www.climatis.com.br:80
    ServerAlias climatis.com.br
    DocumentRoot /var/www/lab
</VirtualHost>

<VirtualHost *:443>
    ServerName www.climatis.com.br:443
    ServerAlias climatis.com.br
    DocumentRoot /var/www/lab
    SSLEngine On
    SSLCertificateFile /opt/lab/certs/lab.crt
    SSLCertificateKeyFile /opt/lab/certs/lab.key
</VirtualHost>
