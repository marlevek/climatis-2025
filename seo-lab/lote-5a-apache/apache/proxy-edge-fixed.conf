    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://backend:80/
    ProxyPassReverse / http://backend:80/
</VirtualHost>
